name: Update Maxima offers and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: maxima-pages
  cancel-in-progress: true

env:
  # Print scraper progress as it happens; buffered output gave every log line
  # the timestamp of the end of its step.
  PYTHONUNBUFFERED: "1"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_scrapers: ${{ steps.path-filter.outputs.run_scrapers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: path-filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          run_scrapers=true

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] \
            && [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"; then
              if [[ -n "$changed_files" ]]; then
                run_scrapers=false
                while IFS= read -r path; do
                  case "$path" in
                    index.html|admin.html|styles.css|admin.css|app.js|admin.js|README.md|.github/workflows/maxima.yml) ;;
                    *) run_scrapers=true; break ;;
                  esac
                done <<< "$changed_files"
              fi
            fi
          fi

          echo "run_scrapers=$run_scrapers" >> "$GITHUB_OUTPUT"
          echo "Run store scrapers: $run_scrapers"
      - name: Validate frontend JavaScript
        run: |
          node --check app.js
          node --check admin.js

  update-data:
    needs: detect-changes
    if: needs.detect-changes.outputs.run_scrapers == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 pymupdf pillow
      - name: Validate scraper syntax
        run: |
          python -m py_compile scripts/scrape_maxima.py
          python -m py_compile scripts/scrape_top.py
          python -m py_compile scripts/scrape_lidl.py
          python -m py_compile scripts/scrape_rimi.py
          python -m py_compile scripts/scrape_rimi_booklets.py
          python -m py_compile scripts/scrape_elvi.py
          python -m py_compile scripts/scrape_latts.py
          python -m py_compile scripts/scrape_vesko.py
          python -m py_compile scripts/scrape_aibe.py
          python -m py_compile scripts/scrape_citro.py
          python -m py_compile scripts/scrape_spar.py
          python -m py_compile scripts/scrape_beta.py
          python -m py_compile scripts/scrape_mego.py
          python -m py_compile scripts/booklet_images.py
          python -m py_compile scripts/run_scrapers.py
      - name: Run scraper tests
        run: python -m unittest discover -s tests -v
      - name: Collect offers from every store
        # Independent scrapers run in parallel lanes (see scripts/run_scrapers.py);
        # a failing store only warns, a failing Maxima scrape fails the job.
        # The runner passes GEMINI_API_KEY to Spar and Beta only.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QWEN_PENDING_DIR: ${{ runner.temp }}/maxima-qwen-pending
          SPAR_PENDING_DIR: ${{ runner.temp }}/spar-qwen-pending
          BETA_PENDING_DIR: ${{ runner.temp }}/beta-qwen-pending
        run: python scripts/run_scrapers.py
      - name: Check for new PDF review cards
        id: qwen-pending
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/maxima-qwen-pending/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: First-pass review with Gemini Flash-Lite
        if: steps.qwen-pending.outputs.available == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_pdf_review.py "$RUNNER_TEMP/maxima-qwen-pending" --offers-file data/offers.json
      - name: Check for cards left for local Qwen
        id: qwen-local
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, pathlib
          # Count cards still lacking a vision note in the CURRENT feed, not in
          # the pending export (which may predate carry-forward of earlier notes).
          remaining = 0
          try:
              payload = json.loads(pathlib.Path("data/offers.json").read_text(encoding="utf-8"))
              remaining = sum(
                  1 for o in payload.get("reviewOffers", [])
                  if not (o.get("reviewEvidence") or {}).get("visionAssist")
              )
          except Exception as exc:
              print(f"cannot read offers feed: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"available={'true' if remaining else 'false'}\n")
          print(f"{remaining} cards left for local Qwen")
          EOF
      - name: Check for Spar pages left for local Qwen
        id: spar-qwen
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/spar-qwen-pending/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for Beta pages left for local Qwen
        id: beta-qwen
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/beta-qwen-pending/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache Qwen3-VL model files
        if: steps.qwen-local.outputs.available == 'true' || steps.spar-qwen.outputs.available == 'true' || steps.beta-qwen.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/maxima-qwen-model
          key: qwen3-vl-4b-q4km-mmproj-q8-${{ runner.os }}-66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a-30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d
      - name: Download public Qwen3-VL GGUF files
        if: steps.qwen-local.outputs.available == 'true' || steps.spar-qwen.outputs.available == 'true' || steps.beta-qwen.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_DIR: ${{ runner.temp }}/maxima-qwen-model
          QWEN_MODEL_REV: 1cd86afb9a95c410a6038ab3b40d8b578c892266
        run: |
          set -euo pipefail
          mkdir -p "$QWEN_MODEL_DIR"
          fetch_verified() {
            local name="$1"
            local sha="$2"
            local target="$QWEN_MODEL_DIR/$name"
            if [[ -f "$target" ]] && echo "$sha  $target" | sha256sum --check --status; then
              echo "Using cached $name"
              return
            fi
            local temporary="$target.part"
            curl --fail --location --retry 4 --retry-all-errors \
              "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/$QWEN_MODEL_REV/$name" \
              --output "$temporary"
            echo "$sha  $temporary" | sha256sum --check
            mv "$temporary" "$target"
          }
          fetch_verified \
            Qwen3VL-4B-Instruct-Q4_K_M.gguf \
            66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a
          fetch_verified \
            mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf \
            30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d
      - name: Build CPU llama-mtmd-cli with Qwen3-VL support
        if: steps.qwen-local.outputs.available == 'true' || steps.spar-qwen.outputs.available == 'true' || steps.beta-qwen.outputs.available == 'true'
        continue-on-error: true
        env:
          LLAMA_CPP_REF: 6d8a8886fa44a4a404c58ace93052ea680193981
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout "$LLAMA_CPP_REF"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release \
            --parallel 4 --target llama-mtmd-cli
          echo "$RUNNER_TEMP/llama.cpp/build/bin" >> "$GITHUB_PATH"
      - name: Review remaining PDF cards with local Qwen3-VL
        if: steps.qwen-local.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_PATH: ${{ runner.temp }}/maxima-qwen-model/Qwen3VL-4B-Instruct-Q4_K_M.gguf
          QWEN_MMPROJ_PATH: ${{ runner.temp }}/maxima-qwen-model/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
          QWEN_LLAMA_CLI: ${{ runner.temp }}/llama.cpp/build/bin/llama-mtmd-cli
        run: python scripts/qwen_pdf_review.py "$RUNNER_TEMP/maxima-qwen-pending" --offers-file data/offers.json
      - name: Review Spar pages with local Qwen3-VL
        if: steps.spar-qwen.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_PATH: ${{ runner.temp }}/maxima-qwen-model/Qwen3VL-4B-Instruct-Q4_K_M.gguf
          QWEN_MMPROJ_PATH: ${{ runner.temp }}/maxima-qwen-model/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
          QWEN_LLAMA_CLI: ${{ runner.temp }}/llama.cpp/build/bin/llama-mtmd-cli
        run: python scripts/scrape_spar.py --qwen-review "$RUNNER_TEMP/spar-qwen-pending"
      - name: Review Beta pages with local Qwen3-VL
        if: steps.beta-qwen.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_PATH: ${{ runner.temp }}/maxima-qwen-model/Qwen3VL-4B-Instruct-Q4_K_M.gguf
          QWEN_MMPROJ_PATH: ${{ runner.temp }}/maxima-qwen-model/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
          QWEN_LLAMA_CLI: ${{ runner.temp }}/llama.cpp/build/bin/llama-mtmd-cli
          BETA_PENDING_DIR: ${{ runner.temp }}/beta-qwen-pending
        run: python scripts/scrape_beta.py --qwen-review "$RUNNER_TEMP/beta-qwen-pending"
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if [ -f data/top-offers.json ]; then git add data/top-offers.json; fi
          if [ -f data/lidl-offers.json ]; then git add data/lidl-offers.json; fi
          if [ -f data/rimi-offers.json ]; then git add data/rimi-offers.json; fi
          if [ -f data/rimi-eveikals-offers.json ]; then git add data/rimi-eveikals-offers.json; fi
          if [ -f data/elvi-offers.json ]; then git add data/elvi-offers.json; fi
          if [ -f data/latts-offers.json ]; then git add data/latts-offers.json; fi
          if [ -f data/mego-offers.json ]; then git add data/mego-offers.json; fi
          if [ -f data/vesko-offers.json ]; then git add data/vesko-offers.json; fi
          if [ -f data/aibe-offers.json ]; then git add data/aibe-offers.json; fi
          if [ -f data/citro-offers.json ]; then git add data/citro-offers.json; fi
          if [ -f data/spar-offers.json ]; then git add data/spar-offers.json; fi
          if [ -f data/beta-offers.json ]; then git add data/beta-offers.json; fi
          if [ -d data/lidl-img ]; then git add data/lidl-img; fi
          if [ -d data/mego-img ]; then git add data/mego-img; fi
          if [ -f data/gemini-usage.json ]; then git add data/gemini-usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Maxima, top!, Lidl, Rimi, Rimi e-veikals, Elvi, LaTS, Mego, Vesko, Aibe, Citro, Spar and Beta offers"
            git push
          fi

  build-pages:
    needs: [detect-changes, update-data]
    if: ${{ always() && !cancelled() && needs.detect-changes.result == 'success' && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build-pages
    if: ${{ always() && needs.build-pages.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
