name: Update Maxima offers and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: maxima-pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 pymupdf
      - name: Diagnose current brochure cells (temporary)
        run: |
          python - <<'PY'
          import requests
          import pymupdf
          from scripts.scrape_maxima import (
              _pdf_page_cells, _clean_pdf_product_name, _looks_like_pdf_product_description,
              _pdf_price_quality,
          )
          urls = {
              "weekly": ("https://www.maxima.lv/uploads/releases/pdf/MAXIMA_KC48_2026_16Y5.pdf", [1, 2]),
              "black-friday": ("https://www.maxima.lv/uploads/releases/pdf/MAXIMA_BLACK-FRIDAY_2026_x8pM.pdf", [0, 1]),
              "roja": ("https://www.maxima.lv/uploads/releases/pdf/MAXIMA_Roja_2026_vdeN.pdf", [0]),
          }
          for label, (url, page_numbers) in urls.items():
              response = requests.get(url, timeout=60)
              response.raise_for_status()
              document = pymupdf.open(stream=response.content, filetype="pdf")
              for page_number in page_numbers:
                  page = document[page_number]
                  print(f"CELLS_PAGE {label} {page_number + 1}")
                  for row, col, raw in _pdf_page_cells(page):
                      name = _clean_pdf_product_name(raw)
                      price_info = _pdf_price_quality(raw)
                      print(
                          f"CELLS_ITEM {label} page={page_number + 1} row={row} col={col} "
                          f"looks={_looks_like_pdf_product_description(name)} "
                          f"name={name!r} price={price_info[:3]} issues={price_info[3]}"
                      )
              document.close()
          PY
      - name: Validate scraper syntax
        run: python -m py_compile scripts/scrape_maxima.py
      - name: Run scraper tests
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript
        run: node --check app.js
      - name: Collect current offers and price history
        run: python scripts/scrape_maxima.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/price-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Maxima offers and price history"
            git push
          fi

  build-pages:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
