name: Update Maxima offers and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: maxima-pages
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 pymupdf
      - name: Validate scraper syntax
        run: |
          python -m py_compile scripts/scrape_maxima.py
          python -m py_compile scripts/scrape_top.py
          python -m py_compile scripts/scrape_lidl.py
          python -m py_compile scripts/scrape_rimi.py
          python -m py_compile scripts/scrape_elvi.py
          python -m py_compile scripts/scrape_latts.py
          python -m py_compile scripts/booklet_images.py
      - name: Run scraper tests
        run: python -m unittest discover -s tests -v
      - name: Validate frontend JavaScript
        run: node --check app.js
      - name: Collect current offers and price history
        run: python scripts/scrape_maxima.py
        env:
          QWEN_PENDING_DIR: ${{ runner.temp }}/maxima-qwen-pending
      - name: Collect top! offers
        continue-on-error: true
        run: python scripts/scrape_top.py
      - name: Collect Lidl offers
        continue-on-error: true
        run: python scripts/scrape_lidl.py
      - name: Collect Rimi offers
        continue-on-error: true
        run: python scripts/scrape_rimi.py
      - name: Collect ELVI offers
        continue-on-error: true
        run: python scripts/scrape_elvi.py
      - name: Collect LaTS offers
        continue-on-error: true
        run: python scripts/scrape_latts.py
      - name: Check for new PDF review cards
        id: qwen-pending
        shell: bash
        run: |
          if compgen -G "$RUNNER_TEMP/maxima-qwen-pending/*.json" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: First-pass review with Gemini Flash-Lite
        if: steps.qwen-pending.outputs.available == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gemini_pdf_review.py "$RUNNER_TEMP/maxima-qwen-pending" --offers-file data/offers.json
      - name: Check for cards left for local Qwen
        id: qwen-local
        shell: bash
        run: |
          python - <<'EOF'
          import json, os, pathlib
          # Count cards still lacking a vision note in the CURRENT feed, not in
          # the pending export (which may predate carry-forward of earlier notes).
          remaining = 0
          try:
              payload = json.loads(pathlib.Path("data/offers.json").read_text(encoding="utf-8"))
              remaining = sum(
                  1 for o in payload.get("reviewOffers", [])
                  if not (o.get("reviewEvidence") or {}).get("visionAssist")
              )
          except Exception as exc:
              print(f"cannot read offers feed: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"available={'true' if remaining else 'false'}\n")
          print(f"{remaining} cards left for local Qwen")
          EOF
      - name: Cache Qwen3-VL model files
        if: steps.qwen-local.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/maxima-qwen-model
          key: qwen3-vl-4b-q4km-mmproj-q8-${{ runner.os }}-66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a-30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d
      - name: Download public Qwen3-VL GGUF files
        if: steps.qwen-local.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_DIR: ${{ runner.temp }}/maxima-qwen-model
          QWEN_MODEL_REV: 1cd86afb9a95c410a6038ab3b40d8b578c892266
        run: |
          set -euo pipefail
          mkdir -p "$QWEN_MODEL_DIR"
          fetch_verified() {
            local name="$1"
            local sha="$2"
            local target="$QWEN_MODEL_DIR/$name"
            if [[ -f "$target" ]] && echo "$sha  $target" | sha256sum --check --status; then
              echo "Using cached $name"
              return
            fi
            local temporary="$target.part"
            curl --fail --location --retry 4 --retry-all-errors \
              "https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct-GGUF/resolve/$QWEN_MODEL_REV/$name" \
              --output "$temporary"
            echo "$sha  $temporary" | sha256sum --check
            mv "$temporary" "$target"
          }
          fetch_verified \
            Qwen3VL-4B-Instruct-Q4_K_M.gguf \
            66358cb18bb6b3b1b6675aa412c7a88ef01d228f481184d13668e5201c730a0a
          fetch_verified \
            mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf \
            30ba2c7dd3127a4561b6cba9d13d0f711c91bdb38742e2f56d73c8cb596bd06d
      - name: Build CPU llama-mtmd-cli with Qwen3-VL support
        if: steps.qwen-local.outputs.available == 'true'
        continue-on-error: true
        env:
          LLAMA_CPP_REF: 6d8a8886fa44a4a404c58ace93052ea680193981
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          git -C "$RUNNER_TEMP/llama.cpp" checkout "$LLAMA_CPP_REF"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" \
            -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON -DGGML_CUDA=OFF
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --config Release \
            --parallel 4 --target llama-mtmd-cli
          echo "$RUNNER_TEMP/llama.cpp/build/bin" >> "$GITHUB_PATH"
      - name: Review remaining PDF cards with local Qwen3-VL
        if: steps.qwen-local.outputs.available == 'true'
        continue-on-error: true
        env:
          QWEN_MODEL_PATH: ${{ runner.temp }}/maxima-qwen-model/Qwen3VL-4B-Instruct-Q4_K_M.gguf
          QWEN_MMPROJ_PATH: ${{ runner.temp }}/maxima-qwen-model/mmproj-Qwen3VL-4B-Instruct-Q8_0.gguf
          QWEN_LLAMA_CLI: ${{ runner.temp }}/llama.cpp/build/bin/llama-mtmd-cli
        run: python scripts/qwen_pdf_review.py "$RUNNER_TEMP/maxima-qwen-pending" --offers-file data/offers.json
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/price-history.json
          if [ -f data/top-offers.json ]; then git add data/top-offers.json; fi
          if [ -f data/lidl-offers.json ]; then git add data/lidl-offers.json; fi
          if [ -f data/rimi-offers.json ]; then git add data/rimi-offers.json; fi
          if [ -f data/elvi-offers.json ]; then git add data/elvi-offers.json; fi
          if [ -f data/latts-offers.json ]; then git add data/latts-offers.json; fi
          if [ -d data/lidl-img ]; then git add data/lidl-img; fi
          if [ -d data/mego-img ]; then git add data/mego-img; fi
          if [ -f data/gemini-usage.json ]; then git add data/gemini-usage.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update Maxima, top!, Lidl, Rimi, Elvi and LaTS offers and price history"
            git push
          fi

  build-pages:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
